[versions]
agp = "8.7.3"
coreKtx = "1.15.0"
credentials = "1.3.0"
googleid = "1.1.1"
firebaseBom = "33.7.0"
googleServices = "4.4.2"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
koinAndroidxCompose = "4.0.0"
kotlinxSerializationJson = "1.7.3"
lifecycleRuntimeKtx = "2.8.7"
